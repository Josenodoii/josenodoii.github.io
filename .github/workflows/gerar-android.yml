name: Gerar app Android

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Número da versão (aumente a cada envio para a Play Store: 1, 2, 3...)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar projeto Android (Bubblewrap)
        env:
          VERSION_CODE: ${{ inputs.versao }}
          VERSION_NAME: 1.0.${{ inputs.versao }}
        run: |
          npm init -y > /dev/null
          npm install @bubblewrap/core@1.27.0
          cat > gen.js <<'EOF'
          const {TwaManifest, TwaGenerator, ConsoleLog} = require('@bubblewrap/core');
          const SITE = process.env.SITE || 'https://josenodoii.github.io';
          (async () => {
            const m = new TwaManifest({
              packageId: 'app.netlify.devendoateascalcas.twa',
              host: new URL(SITE).host,
              name: 'Devendo Até as Calças',
              launcherName: 'Devendo',
              display: 'fullscreen',
              orientation: 'portrait',
              themeColor: '#2A1A0E', navigationColor: '#2A1A0E', backgroundColor: '#2A1A0E',
              enableNotifications: false,
              startUrl: '/index.html',
              iconUrl: SITE + '/img/icone-512.png',
              maskableIconUrl: SITE + '/img/icone-maskable-512.png',
              splashScreenFadeOutDuration: 300,
              signingKey: {path: './signing.keystore', alias: 'my-key-alias'},
              appVersionCode: Number(process.env.VERSION_CODE || 1),
              appVersion: process.env.VERSION_NAME || '1.0.0',
              webManifestUrl: SITE + '/manifest.json',
              fallbackType: 'customtabs',
              enableSiteSettingsShortcut: false,
              minSdkVersion: 24,
            });
            const err = m.validate && m.validate(); if (err) throw new Error(err);
            await new TwaGenerator().createTwaProject('./android', m, new ConsoleLog('gen'));
            await m.saveToFile('./android/twa-manifest.json');
            console.log('OK');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node gen.js

      - name: Preparar chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/signing.keystore
          echo "Impressao digital da chave (deve terminar em ...7B:A2:E9):"
          keytool -list -v -keystore android/signing.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep SHA256

      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Assinar APK e AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p saida
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk saida/alinhado.apk
          "$BT/apksigner" sign --ks android/signing.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out saida/Devendo.apk saida/alinhado.apk
          rm saida/alinhado.apk
          cp android/app/build/outputs/bundle/release/app-release.aab saida/Devendo.aab
          jarsigner -keystore android/signing.keystore -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 saida/Devendo.aab "$KEY_ALIAS"
          "$BT/apksigner" verify --print-certs saida/Devendo.apk | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: Devendo-android
          path: saida/
