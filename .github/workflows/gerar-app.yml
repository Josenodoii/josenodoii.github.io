name: Gerar app independente

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Número da versão (aumente a cada envio para a Play Store: 2, 3, 4...)"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar o site com as últimas correções
        run: |
          python3 - <<'PY_FIM'
          # Leva as últimas correções (música em segundo plano) para o site.
          import re
          idx = open('index.html', encoding='utf-8').read()
          troca = [
            ('if(ac){ if(ac.state==="suspended") ac.resume(); return; }',
             'if(ac){ if(ac.state==="suspended" && !document.hidden) ac.resume(); return; }'),
            ('  return { init, play, startMusic, setVol, running:',
             '  function pause(){ if(ac && ac.state==="running") ac.suspend().catch(()=>{}); }\n  return { init, play, startMusic, setVol, pause, running:'),
            ('document.addEventListener("visibilitychange",()=>{ if(!document.hidden) Sound.init(); });',
             'function audioPause(){ Sound.pause(); }\ndocument.addEventListener("visibilitychange",()=>{ if(document.hidden) audioPause(); else Sound.init(); });\nwindow.addEventListener("pagehide", audioPause);\ndocument.addEventListener("freeze", audioPause);'),
            ('!/claude|anthropic/.test(location.hostname)',
             '!/claude|anthropic|appassets\\.androidplatform/.test(location.hostname)'),
          ]
          for velho, novo in troca:
              if velho in idx: idx = idx.replace(velho, novo, 1)
          open('index.html', 'w', encoding='utf-8').write(idx)
          sw = open('sw.js', encoding='utf-8').read()
          sw = re.sub(r'devendo-v8"', 'devendo-v9"', sw)
          open('sw.js', 'w', encoding='utf-8').write(sw)
          print('site atualizado')
          PY_FIM
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Corrige a música quando o jogo fica em segundo plano"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Criar o projeto Android
        run: |
          mkdir -p "$(dirname "app-build/settings.gradle")"
          cat > 'app-build/settings.gradle' <<'FIM_DO_ARQUIVO'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Devendo"
          include ':app'
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/build.gradle")"
          cat > 'app-build/build.gradle' <<'FIM_DO_ARQUIVO'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/gradle.properties")"
          cat > 'app-build/gradle.properties' <<'FIM_DO_ARQUIVO'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/app/build.gradle")"
          cat > 'app-build/app/build.gradle' <<'FIM_DO_ARQUIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.github.josenodoii.twa'
              compileSdk 35

              defaultConfig {
                  applicationId 'io.github.josenodoii.twa'
                  minSdk 24
                  targetSdk 35
                  versionCode Integer.parseInt((project.findProperty('versionCode') ?: '2').toString())
                  versionName (project.findProperty('versionName') ?: '2.0').toString()
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_FILE') ?: 'sem-chave.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/app/src/main/AndroidManifest.xml")"
          cat > 'app-build/app/src/main/AndroidManifest.xml' <<'FIM_DO_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Devendo"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|uiMode|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/app/src/main/res/values/styles.xml")"
          cat > 'app-build/app/src/main/res/values/styles.xml' <<'FIM_DO_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fundo">#2A1A0E</color>
              <color name="icone_fundo">#2D8A55</color>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@color/fundo</item>
                  <item name="android:statusBarColor">@color/fundo</item>
                  <item name="android:navigationBarColor">@color/fundo</item>
              </style>
          </resources>
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/app/src/main/res/values-v28/styles.xml")"
          cat > 'app-build/app/src/main/res/values-v28/styles.xml' <<'FIM_DO_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@color/fundo</item>
                  <item name="android:statusBarColor">@color/fundo</item>
                  <item name="android:navigationBarColor">@color/fundo</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > 'app-build/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'FIM_DO_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icone_fundo" />
              <foreground android:drawable="@mipmap/ic_launcher_fg" />
          </adaptive-icon>
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/app/src/main/java/io/github/josenodoii/twa/MainActivity.java")"
          cat > 'app-build/app/src/main/java/io/github/josenodoii/twa/MainActivity.java' <<'FIM_DO_ARQUIVO'
          package io.github.josenodoii.twa;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          /**
           * Devendo Até as Calças — app independente.
           * O jogo fica dentro do próprio app (pasta assets/www) e roda num WebView,
           * sem depender do Chrome e sem internet.
           */
          public class MainActivity extends Activity {

              // Endereço "virtual" usado para servir os arquivos do jogo.
              // Ter um endereço https faz o salvamento (localStorage) funcionar normalmente.
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START = "https://" + HOST + "/index.html";

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF2A1A0E);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setTextZoom(100);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if (!HOST.equals(u.getHost())) return null;
                          String path = u.getPath();
                          if (path == null || path.equals("") || path.equals("/")) path = "/index.html";
                          try {
                              InputStream in = getAssets().open("www" + Uri.decode(path));
                              Map<String, String> headers = new HashMap<>();
                              headers.put("Cache-Control", "no-cache");
                              headers.put("Access-Control-Allow-Origin", "*");
                              return new WebResourceResponse(mime(path), "UTF-8", 200, "OK", headers, in);
                          } catch (IOException e) {
                              return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found", null, null);
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          // Tudo que for do jogo abre aqui dentro; links de fora são ignorados.
                          return !HOST.equals(req.getUrl().getHost());
                      }
                  });

                  setContentView(web);
                  hideSystemBars();
                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(START);
              }

              private static String mime(String path) {
                  String p = path.toLowerCase();
                  if (p.endsWith(".html")) return "text/html";
                  if (p.endsWith(".js")) return "application/javascript";
                  if (p.endsWith(".json") || p.endsWith(".webmanifest")) return "application/json";
                  if (p.endsWith(".css")) return "text/css";
                  if (p.endsWith(".png")) return "image/png";
                  if (p.endsWith(".jpg") || p.endsWith(".jpeg")) return "image/jpeg";
                  if (p.endsWith(".svg")) return "image/svg+xml";
                  if (p.endsWith(".ttf")) return "font/ttf";
                  if (p.endsWith(".woff2")) return "font/woff2";
                  if (p.endsWith(".txt")) return "text/plain";
                  return "application/octet-stream";
              }

              /** Tela cheia: esconde a barra de notificações e a de navegação. */
              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  Window w = getWindow();
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      w.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @Override
              protected void onPause() {
                  // Saiu do jogo: salva e silencia a música.
                  if (web != null) {
                      web.evaluateJavascript("try{save();}catch(e){} try{audioPause();}catch(e){}", null);
                      web.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
                  hideSystemBars();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              /** Botão "voltar": fecha a janela aberta no jogo; se não houver, minimiza o app. */
              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (web == null) { super.onBackPressed(); return; }
                  web.evaluateJavascript(
                          "(function(){try{" +
                          "var m=['raceModal','chest','offline'];" +
                          "for(var i=0;i<m.length;i++){var e=document.getElementById(m[i]);" +
                          "if(e&&!e.hidden){var b=e.querySelector('#raceClose,#chestBtn,#offBtn');if(b&&!b.disabled)b.click();return 1;}}" +
                          "if(typeof openId!=='undefined'&&openId){openPanel(null);return 1;}" +
                          "}catch(e){}return 0;})()",
                          value -> { if (!"1".equals(value)) moveTaskToBack(true); });
              }

              @Override
              protected void onDestroy() {
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/injetar_fontes.py")"
          cat > 'app-build/injetar_fontes.py' <<'FIM_DO_ARQUIVO'
          # Troca as fontes do Google por cópias guardadas dentro do app (funciona sem internet).
          import re, sys
          p = sys.argv[1]; s = open(p, encoding="utf-8").read()
          s = re.sub(r'<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*', '', s)
          s = re.sub(r'<link rel="stylesheet" href="https://fonts\.googleapis\.com/[^"]*">',
            '<style>@font-face{font-family:"Press Start 2P";src:url(fonts/PressStart2P-Regular.ttf) format("truetype");font-display:block}'
            '@font-face{font-family:"Pixelify Sans";src:url(fonts/PixelifySans.ttf) format("truetype");font-weight:400 700;font-display:block}</style>', s)
          assert "fonts.googleapis" not in s, "fonte do Google ainda presente"
          open(p, "w", encoding="utf-8").write(s)
          print("fontes embutidas")
          FIM_DO_ARQUIVO
          mkdir -p "$(dirname "app-build/icones.py")"
          cat > 'app-build/icones.py' <<'FIM_DO_ARQUIVO'
          # Gera os ícones do app a partir dos ícones do jogo.
          import os
          from PIL import Image
          m = Image.open('img/icone-maskable-512.png').convert('RGBA')
          legacy = Image.open('img/icone-512.png').convert('RGBA')
          bg = m.getpixel((3, 3))
          res = 'app-build/app/src/main/res'
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              legacy.resize((round(48*k),)*2, Image.LANCZOS).save(f'{res}/mipmap-{d}/ic_launcher.png')
              S = round(108*k); inner = round(90*k)
              fg = Image.new('RGBA', (S, S), bg)
              fg.paste(m.resize((inner, inner), Image.LANCZOS), ((S-inner)//2,)*2)
              fg.save(f'{res}/mipmap-{d}/ic_launcher_fg.png')
          print('icones prontos')
          FIM_DO_ARQUIVO

      - name: Colocar o jogo, as fontes e os ícones dentro do app
        run: |
          W=app-build/app/src/main/assets/www
          mkdir -p "$W/fonts"
          cp index.html manifest.json privacidade.html "$W/"
          cp -r img "$W/img"
          curl -sSfL -o "$W/fonts/PressStart2P-Regular.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/pressstart2p/PressStart2P-Regular.ttf"
          curl -sSfL -o "$W/fonts/PixelifySans.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf"
          python3 app-build/injetar_fontes.py "$W/index.html"
          pip install --quiet pillow
          python3 app-build/icones.py

      - name: Preparar chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > chave.txt
          echo "Tamanho da chave: $(wc -c < chave.txt) (deve ser 3656)"
          base64 -d chave.txt > app-build/chave.keystore
          echo "Impressao digital (deve terminar em ...E3:85:6D):"
          keytool -list -v -keystore app-build/chave.keystore -storepass "$KS_PASS" | grep SHA256

      - name: Compilar APK e AAB
        env:
          KS_FILE: ${{ github.workspace }}/app-build/chave.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd app-build
          gradle assembleRelease bundleRelease --no-daemon --stacktrace -PversionCode=${{ inputs.versao }} -PversionName=2.${{ inputs.versao }}
          mkdir -p ../saida
          cp app/build/outputs/apk/release/app-release.apk ../saida/Devendo.apk
          cp app/build/outputs/bundle/release/app-release.aab ../saida/Devendo.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Devendo-app
          path: saida/
